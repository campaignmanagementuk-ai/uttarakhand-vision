<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>संपर्क करें (Contact Us) - Uttarakhand Vision</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>संपर्क करें (Contact Us)</h1>
        <p>किसी भी खबर, सुझाव या विज्ञापन के लिए हमसे जुड़ें</p>
    </header>

    <nav>
        <a href="index.html">← मुख्य होमपेज पर लौटें</a>
    </nav>

    <main class="container">
        <div class="news-box">
            <h2>संपर्क विवरण</h2>
            <p><strong>ईमेल:</strong> news@uttarakhandvision.com</p>
            <p><strong>फोन / व्हाट्सएप:</strong> +91-XXXXXXXXXX</p>
            <p><strong>पता:</strong> उत्तराखंड, भारत</p>

            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">

            <h2>हमें संदेश भेजें</h2>
            <form action="#" method="POST">
                <p>
                    <label>आपका नाम:</label><br>
                    <input type="text" name="name" required style="width: 100%; padding: 8px; margin-top: 5px;">
                </p>
                <p>
                    <label>ईमेल या मोबाइल नंबर:</label><br>
                    <input type="text" name="contact" required style="width: 100%; padding: 8px; margin-top: 5px;">
                </p>
                <p>
                    <label>संदेश / खबर की जानकारी:</label><br>
                    <textarea name="message" rows="5" required style="width: 100%; padding: 8px; margin-top: 5px;"></textarea>
                </p>
                <button type="submit" style="padding: 10px 20px; cursor: pointer;">संदेश भेजें</button>
            </form>
        </div>
    </main>
</body>
</html>
