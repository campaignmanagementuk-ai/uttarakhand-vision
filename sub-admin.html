<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporter & Sub-Admin Portal - Uttarakhand Vision</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase App & Realtime Database CDN -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

    <!-- ==================== LOGIN SECTION ==================== -->
    <div id="loginSection" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-700/50">
            <div class="bg-indigo-600 p-6 text-white text-center relative">
                <div class="w-12 h-12 bg-white/10 rounded-full flex items-center justify-center mx-auto mb-3 backdrop-blur-sm">
                    <i class="fa-solid fa-user-shield text-2xl"></i>
                </div>
                <h2 class="text-2xl font-bold">Reporter Portal</h2>
                <p class="text-indigo-200 text-sm mt-1">डैशबोर्ड में लॉगिन करें</p>
            </div>
            
            <form id="loginForm" onsubmit="handleLogin(event)" class="p-6 space-y-4">
                <div id="loginError" class="hidden bg-red-50 border-l-4 border-red-500 p-3 rounded text-sm text-red-700 flex items-center gap-2">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span id="loginErrorText">गलत यूजरनेम या पासवर्ड!</span>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">यूजरनेम / ईमेल</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" id="loginUsername" required class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm" placeholder="username या email">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">पासवर्ड</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="loginPassword" required class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm" placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" id="loginBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition duration-200 flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/30">
                    <span>लॉगिन करें</span>
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- ==================== MAIN DASHBOARD SECTION ==================== -->
    <div id="dashboardSection" class="hidden min-h-screen flex flex-col md:flex-row">
        <!-- Sidebar -->
        <aside class="w-full md:w-64 bg-slate-900 text-slate-300 flex flex-col shadow-xl">
            <div class="p-5 border-b border-slate-800 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold">
                        <i class="fa-solid fa-newspaper"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-white text-base">Reporter Panel</h1>
                        <p class="text-xs text-slate-400" id="reporterDistrictLabel">District Panel</p>
                    </div>
                </div>
            </div>

            <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
                <a href="#" onclick="switchTab('addNews')" id="nav-addNews" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium bg-indigo-600 text-white transition">
                    <i class="fa-solid fa-pen-to-square w-5"></i>
                    <span>खबर जोड़ें (Add News)</span>
                </a>
                <a href="#" onclick="switchTab('myNews')" id="nav-myNews" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-slate-800 text-slate-300 transition">
                    <i class="fa-solid fa-list-check w-5"></i>
                    <span>मेरी खबरें (My News)</span>
                </a>
            </nav>

            <div class="p-4 border-t border-slate-800">
                <div class="flex items-center justify-between mb-3 px-2">
                    <span class="text-xs text-slate-400 truncate" id="loggedInUserName">User</span>
                </div>
                <button onclick="handleLogout()" class="w-full flex items-center justify-center gap-2 bg-red-600/10 hover:bg-red-600 text-red-400 hover:text-white border border-red-600/20 py-2 rounded-lg text-sm font-medium transition">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>लॉग आउट</span>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col bg-slate-50 overflow-y-auto">
            <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shadow-sm">
                <h2 id="pageTitle" class="text-lg font-bold text-slate-800">खबर जोड़ें</h2>
                <div class="text-sm font-medium text-slate-600">
                    <span class="text-indigo-600 font-semibold" id="headerRoleBadge">Reporter</span>
                </div>
            </header>

            <div class="p-6 max-w-5xl mx-auto w-full">
                <!-- TAB 1: ADD NEWS -->
                <div id="tab-addNews" class="space-y-6">
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                        <h3 class="text-base font-bold text-slate-800 mb-4 pb-2 border-b">नई खबर प्रकाशित करें</h3>
                        <form id="newsForm" onsubmit="submitNews(event)" class="space-y-4">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">खबर का शीर्षक (Title)</label>
                                    <input type="text" id="newsTitle" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">श्रेणी (Category)</label>
                                    <select id="newsCategory" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                                        <option value="Uttarakhand">उत्तराखंड (Uttarakhand)</option>
                                        <option value="Politics">राजनीति (Politics)</option>
                                        <option value="Crime">अपराध (Crime)</option>
                                        <option value="District">जिला विशेष (District)</option>
                                        <option value="Other">अन्य (Other)</option>
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">खबर का विवरण (Content)</label>
                                <textarea id="newsContent" rows="6" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="यहाँ विस्तार से लिखें..."></textarea>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">इमेज लिंक (Image URL)</label>
                                <input type="url" id="newsImage" placeholder="https://example.com/image.jpg" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            </div>

                            <button type="submit" id="submitNewsBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2.5 rounded-lg text-sm shadow-md transition">
                                <i class="fa-solid fa-paper-plane mr-1"></i> खबर सबमिट करें
                            </button>
                        </form>
                    </div>
                </div>

                <!-- TAB 2: MY NEWS -->
                <div id="tab-myNews" class="hidden space-y-6">
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="px-6 py-4 border-b bg-slate-50 flex justify-between items-center">
                            <h3 class="font-bold text-slate-800">मेरी सबमिट की गई खबरें</h3>
                            <button onclick="loadMyHistory()" class="text-xs bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-lg border border-indigo-200 hover:bg-indigo-100 font-medium transition">
                                <i class="fa-solid fa-rotate-right mr-1"></i> रिफ्रेश करें
                            </button>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-sm">
                                <thead>
                                    <tr class="bg-slate-100/70 text-slate-600 border-b">
                                        <th class="p-3 font-semibold">शीर्षक (Title)</th>
                                        <th class="p-3 font-semibold">श्रेणी</th>
                                        <th class="p-3 font-semibold">दिनांक</th>
                                        <th class="p-3 font-semibold">स्टेटस (Status)</th>
                                    </tr>
                                </thead>
                                <tbody id="myNewsTableBody" class="divide-y divide-slate-100">
                                    <!-- Dynamic rows -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Notification Popup -->
    <div id="toastNotification" class="fixed bottom-5 right-5 hidden z-50 flex items-center space-x-3 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl border border-slate-700 text-sm transition-all transform translate-y-2">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
        <span id="toastMessage">सफल!</span>
    </div>

    <!-- ==================== FIREBASE & SCRIPT ==================== -->
    <script>
        const firebaseConfig = {
            databaseURL: "https://uttarakhandvision-default-rtdb.firebaseio.com/"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let currentReporter = null;

        window.onload = function() {
            const saved = localStorage.getItem("reporterSession");
            if (saved) {
                try {
                    currentReporter = JSON.parse(saved);
                    showDashboard();
                } catch(e) {
                    localStorage.removeItem("reporterSession");
                }
            }
        };

        function showToast(message, type = "success") {
            const toast = document.getElementById("toastNotification");
            const toastMsg = document.getElementById("toastMessage");
            const toastIcon = document.getElementById("toastIcon");

            toastMsg.innerText = message;
            if (type === "success") {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400 text-lg";
            } else {
                toastIcon.className = "fa-solid fa-circle-info text-sky-400 text-lg";
            }

            toast.classList.remove("hidden", "translate-y-2");
            setTimeout(() => {
                toast.classList.add("hidden", "translate-y-2");
            }, 3500);
        }

        function handleLogin(e) {
            e.preventDefault();
            const usernameInput = document.getElementById("loginUsername").value.trim();
            const passwordInput = document.getElementById("loginPassword").value.trim();
            const errorBox = document.getElementById("loginError");
            const errorText = document.getElementById("loginErrorText");
            const loginBtn = document.getElementById("loginBtn");

            errorBox.classList.add("hidden");
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i><span>लॉगिन हो रहा है...</span>';

            // Local fallback admins for immediate zero-error login
            const localAdmins = [
                { username: "sanjay", password: "123", name: "Sanjay", district: "Dehradun", role: "Sub-Admin" },
                { username: "rahul", password: "123", name: "Rahul", district: "Haridwar", role: "Sub-Admin" },
                { username: "karan", password: "123", name: "Karan", district: "Nainital", role: "Sub-Admin" }
            ];

            let foundUser = localAdmins.find(u => u.username === usernameInput && u.password === passwordInput);

            if (foundUser) {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<span>लॉगिन करें</span><i class="fa-solid fa-arrow-right-to-bracket"></i>';
                localStorage.setItem("reporterSession", JSON.stringify(foundUser));
                currentReporter = foundUser;
                showDashboard();
                showToast("सफलतापूर्वक लॉगिन हो गए!", "success");
                return;
            }

            // Try Firebase database subadmins lookup
            db.ref("subadmins").once("value")
                .then((snapshot) => {
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<span>लॉगिन करें</span><i class="fa-solid fa-arrow-right-to-bracket"></i>';

                    if (snapshot.exists()) {
                        snapshot.forEach((childSnap) => {
                            const data = childSnap.val();
                            if ((data.username === usernameInput || data.email === usernameInput) && data.password === passwordInput) {
                                foundUser = {
                                    id: childSnap.key,
                                    name: data.name || data.username || "Reporter",
                                    username: data.username || usernameInput,
                                    district: data.district || "Uttarakhand",
                                    role: data.role || "Sub-Admin"
                                };
                            }
                        });
                    }

                    if (foundUser) {
                        localStorage.setItem("reporterSession", JSON.stringify(foundUser));
                        currentReporter = foundUser;
                        showDashboard();
                        showToast("सफलतापूर्वक लॉगिन हो गए!", "success");
                    } else {
                        errorText.innerText = "गलत यूजरनेम या पासवर्ड! कृपया जांच लें।";
                        errorBox.classList.remove("hidden");
                    }
                })
                .catch((error) => {
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<span>लॉगिन करें</span><i class="fa-solid fa-arrow-right-to-bracket"></i>';
                    errorText.innerText = "कनेक्शन त्रुटि! कृपया पुनः प्रयास करें।";
                    errorBox.classList.remove("hidden");
                });
        }

        function showDashboard() {
            document.getElementById("loginSection").classList.add("hidden");
            document.getElementById("dashboardSection").classList.remove("hidden");
            document.getElementById("loggedInUserName").innerText = currentReporter.name || currentReporter.username;
            document.getElementById("reporterDistrictLabel").innerText = currentReporter.district || "Reporter Panel";
            document.getElementById("headerRoleBadge").innerText = currentReporter.role || "Sub-Admin";
            switchTab('addNews');
        }

        function handleLogout() {
            localStorage.removeItem("reporterSession");
            currentReporter = null;
            document.getElementById("dashboardSection").classList.add("hidden");
            document.getElementById("loginSection").classList.remove("hidden");
            document.getElementById("loginForm").reset();
            showToast("लॉग आउट हो गए", "info");
        }

        function switchTab(tabName) {
            document.getElementById("tab-addNews").classList.add("hidden");
            document.getElementById("tab-myNews").classList.add("hidden");
            document.getElementById("nav-addNews").className = "flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-slate-800 text-slate-300 transition";
            document.getElementById("nav-myNews").className = "flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-slate-800 text-slate-300 transition";

            if (tabName === 'addNews') {
                document.getElementById("tab-addNews").classList.remove("hidden");
                document.getElementById("nav-addNews").className = "flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium bg-indigo-600 text-white transition";
                document.getElementById("pageTitle").innerText = "खबर जोड़ें";
            } else if (tabName === 'myNews') {
                document.getElementById("tab-myNews").classList.remove("hidden");
                document.getElementById("nav-myNews").className = "flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium bg-indigo-600 text-white transition";
                document.getElementById("pageTitle").innerText = "मेरी खबरें";
                loadMyHistory();
            }
        }

        function submitNews(e) {
            e.preventDefault();
            const btn = document.getElementById("submitNewsBtn");
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin mr-1"></i> सबमिट हो रहा है...';

            const newsData = {
                title: document.getElementById("newsTitle").value,
                category: document.getElementById("newsCategory").value,
                content: document.getElementById("newsContent").value,
                image: document.getElementById("newsImage").value || "",
                reporterName: currentReporter.name || currentReporter.username,
                reporterDistrict: currentReporter.district || "General",
                listType: "Pending",
                date: new Date().toLocaleDateString('hi-IN')
            };

            db.ref("newsList").push(newsData)
                .then(() => {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-1"></i> खबर सबमिट करें';
                    document.getElementById("newsForm").reset();
                    showToast("खबर सफलतापूर्वक सबमिट हो गई!", "success");
                    switchTab('myNews');
                })
                .catch((err) => {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-1"></i> खबर सबमिट करें';
                    showToast("खबर सबमिट करने में विफल!", "info");
                });
        }

        function loadMyHistory() {
            const tbody = document.getElementById("myNewsTableBody");
            tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-slate-500"><i class="fa-solid fa-spinner animate-spin mr-2"></i> लोड हो रहा है...</td></tr>';

            db.ref("newsList").once("value")
                .then((snapshot) => {
                    tbody.innerHTML = "";
                    if (!snapshot.exists()) {
                        tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-slate-500">कोई खबर नहीं मिली।</td></tr>';
                        return;
                    }

                    let foundAny = false;
                    snapshot.forEach((childSnap) => {
                        const item = childSnap.val();
                        if (item.reporterName === (currentReporter.name || currentReporter.username)) {
                            foundAny = true;
                            let pillClass = "bg-amber-100 text-amber-800";
                            let statusLabel = item.listType || "Pending";

                            if (statusLabel === 'Approved') pillClass = "bg-emerald-100 text-emerald-800";
                            if (statusLabel === 'Rejected') pillClass = "bg-red-100 text-red-800";

                            const tr = document.createElement("tr");
                            tr.className = "hover:bg-slate-50/80 transition";
                            tr.innerHTML = `
                                <td class="p-3 font-medium text-slate-800">${escapeHtml(item.title || 'Untitled')}</td>
                                <td class="p-3 text-slate-600">${escapeHtml(item.category || '-')}</td>
                                <td class="p-3 text-slate-500 text-xs">${escapeHtml(item.date || '-')}</td>
                                <td class="p-3"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${pillClass}">${statusLabel}</span></td>
                            `;
                            tbody.appendChild(tr);
                        }
                    });

                    if (!foundAny) {
                        tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-slate-500">आपने अभी तक कोई खबर नहीं जोड़ी है।</td></tr>';
                    }
                })
                .catch(() => {
                    tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-red-500">डेटा लोड करने में त्रुटि।</td></tr>';
                });
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
